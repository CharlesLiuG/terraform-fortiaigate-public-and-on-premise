{{- /*
Public-facing TLS secret for the ingress only. Created when TLS is enabled,
an ingress cert is configured, and a distinct secret name is set. Keeping this
separate from fortiaigate-tls-secret lets the ingress serve the public
*.fortinet.com.cn cert while internal services keep the self-signed cert.
*/ -}}
{{- if and .Values.tls.enabled .Values.ingress.tls .Values.ingress.tls.cert .Values.ingress.tls.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.tls.secretName }}
  labels:
    app.kubernetes.io/name: fortiaigate
    app.kubernetes.io/part-of: fortiaigate-platform
    app.kubernetes.io/managed-by: helm
type: kubernetes.io/tls
data:
  tls.crt: {{ tpl (.Files.Get .Values.ingress.tls.cert) $ | b64enc }}
  tls.key: {{ tpl (.Files.Get .Values.ingress.tls.key) $ | b64enc }}
{{- end }}
